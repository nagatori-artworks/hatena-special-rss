name: Update Hatena special RSS

on:
  schedule:
    # Every two hours at :17 UTC (the schedule is best-effort).
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: hatena-special-rss-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test scraper on sample HTML
        run: python -m unittest discover -s tests -v
      - name: Generate the three RSS files
        run: python generate.py
      # Commit generated RSS + first-seen dates, allowing later runs to reuse
      # the last successful version if Hatena is temporarily inaccessible.
      - name: Save generated files in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Hatena special RSS [skip ci]'
            git push
          else
            echo 'No changes in feeds or status.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static RSS site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
